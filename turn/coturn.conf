# Coturn 本地测试用配置（Docker）
# 见 README「TURN 本地测试」一节

listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# 客户端连到 TURN 时看到的「外部地址」，需与前端用的 TURN URL 一致：
# - 本机测：EXTERNAL_IP=127.0.0.1，前端 TURN URL 用 turn:127.0.0.1:3478 或 turn:localhost:3478
# - 另一台设备测：EXTERNAL_IP=本机局域网 IP（如 192.168.1.100），前端用 turn:192.168.1.100:3478
external-ip=127.0.0.1
# 本机同机双开浏览器 + 强制 TURN 时，peer 常落在 127.0.0.1，需要放开回环地址
# 仅用于本地调试；生产环境不要启用
allow-loopback-peers
# allow-loopback-peers 需要非空 cli-password 才能启动（仅本地测试）
cli-password=localtest
# 本地测试时浏览器/容器可能出现 RFC1918 地址作为 peer，显式放行以避免 CREATE_PERMISSION 403
allowed-peer-ip=10.0.0.0-10.255.255.255
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=127.0.0.1-127.255.255.255

realm=local
user=test:test123

min-port=49152
max-port=49200

verbose
log-file=stdout
